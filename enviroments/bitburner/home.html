<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Returning to Bitburner - Game Overview</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-shell">
        <aside class="bb-sidebar">
            <div class="bb-title">Bitburner v2.8.1</div>
            <div class="bb-group">Hacking</div>
            <a class="bb-link" href="overview.html" target="contentframe">Overview</a>
            <a class="bb-link" href="scripts.html" target="contentframe">Script Notes</a>
            <a class="bb-link" href="checklist.html" target="contentframe">Checklist</a>
            <div class="bb-group">Character</div>
            <span class="bb-muted">Stats</span>
            <span class="bb-muted">Factions</span>
            <span class="bb-muted">Augmentations</span>
            <div class="bb-group">World</div>
            <a class="bb-link" href="city.html" target="contentframe">City</a>
            <span class="bb-muted">Travel</span>
            <span class="bb-muted">Job</span>
            <div class="bb-group">Help</div>
            <span class="bb-muted">Milestones</span>
            <a class="bb-link" href="https://github.com/bitburner-official/bitburner-src/tree/dev" target="_blank">Documentation</a>
        </aside>

        <main class="bb-main">
            <iframe class="content-frame" name="contentframe" title="Bitburner content" src="overview.html"></iframe>
        </main>

        <details class="bb-stats" open>
            <summary class="bb-stats-title">Overview</summary>
            <div class="bb-stats-body">
                <div class="stat-row hp">
                    <div class="stat-line hp"><span>HP</span><span>7 / 12</span></div>
                    <div class="mini-track"><span style="width: 58%"></span></div>
                </div>
                <div class="stat-row money">
                    <div class="stat-line money"><span>Money</span><span>$31.56m</span></div>
                </div>
                <div class="stat-row hack">
                    <div class="stat-line hack"><span>Hack</span><span>353</span></div>
                    <div class="mini-track"><span style="width: 58%"></span></div>
                </div>
                <div class="stat-row">
                    <div class="stat-line"><span>Str</span><span>19</span></div>
                    <div class="mini-track"><span style="width: 38%"></span></div>
                </div>
                <div class="stat-row">
                    <div class="stat-line"><span>Def</span><span>21</span></div>
                    <div class="mini-track"><span style="width: 42%"></span></div>
                </div>
                <div class="stat-row">
                    <div class="stat-line"><span>Dex</span><span>22</span></div>
                    <div class="mini-track"><span style="width: 44%"></span></div>
                </div>
                <div class="stat-row">
                    <div class="stat-line"><span>Agi</span><span>23</span></div>
                    <div class="mini-track"><span style="width: 46%"></span></div>
                </div>
                <div class="stat-row cha">
                    <div class="stat-line cha"><span>Cha</span><span>31</span></div>
                    <div class="mini-track"><span style="width: 52%"></span></div>
                </div>
            </div>
        </details>
    </div>
</body>
</html>
