<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Ref Maker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #18181a;
      --sidebar:  #111113;
      --card:     #24242c;
      --card-bd:  #34343e;
      --toolbar:  #0d0d0f;
      --accent:   #9155ff;
      --green:    #37af5f;
      --red:      #d24141;
      --text:     #dadae0;
      --muted:    #69697a;
      --btn:      #30303a;
      --btn-h:    #44444e;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ─────────────────────────────────────────── */
    #toolbar {
      background: var(--toolbar);
      border-bottom: 1px solid var(--card-bd);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 7px 10px;
      flex-shrink: 0;
    }
    #toolbar .group { display: flex; align-items: center; gap: 6px; }
    #toolbar .sep {
      width: 1px; height: 22px;
      background: var(--card-bd);
      margin: 0 2px;
    }
    #toolbar label { color: var(--muted); font-size: 12px; white-space: nowrap; }

    button {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      padding: 6px 14px;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-accent  { background: color-mix(in srgb, var(--accent) 80%, #000); color: #fff; }
    .btn-accent:hover { background: var(--accent); }
    .btn-green   { background: color-mix(in srgb, var(--green) 80%, #000); color: #fff; }
    .btn-green:hover  { background: var(--green); }
    .btn-red     { background: color-mix(in srgb, var(--red) 80%, #000); color: #fff; }
    .btn-red:hover    { background: var(--red); }
    .btn-neutral { background: var(--btn); color: var(--text); }
    .btn-neutral:hover { background: var(--btn-h); }

    input[type=range] {
      -webkit-appearance: none;
      background: var(--btn);
      height: 4px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
    }
    input[type=number] {
      background: var(--btn);
      color: var(--text);
      border: 1px solid var(--card-bd);
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 12px;
      width: 72px;
      outline: none;
    }
    input[type=number]:focus { border-color: var(--accent); }

    input[type=checkbox] { accent-color: var(--accent); cursor: pointer; }
    .check-label { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; cursor: pointer; }
    .check-label:hover { color: var(--text); }

    #count { color: var(--muted); font-size: 12px; }

    /* ── Main layout ─────────────────────────────────────── */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    #sidebar {
      width: 262px;
      min-width: 220px;
      background: var(--sidebar);
      border-right: 1px solid var(--card-bd);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
      padding: 8px;
      gap: 5px;
    }
    #sidebar::-webkit-scrollbar { width: 6px; }
    #sidebar::-webkit-scrollbar-track { background: var(--sidebar); }
    #sidebar::-webkit-scrollbar-thumb { background: #3e3e4b; border-radius: 3px; }

    .thumb-card {
      background: var(--card);
      border: 1px solid var(--card-bd);
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 0;
      padding: 5px 4px 5px 6px;
      flex-shrink: 0;
    }
    .thumb-card .thumb {
      width: 72px;
      height: 54px;
      object-fit: contain;
      background: #1a1a1e;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .thumb-info {
      flex: 1;
      min-width: 0;
      padding: 0 6px;
    }
    .thumb-info .tname {
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .thumb-info .tdims {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }
    .thumb-btns {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sm-btn {
      width: 22px; height: 19px;
      font-size: 9px;
      padding: 0;
      border-radius: 4px;
      background: var(--btn);
      color: var(--text);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s;
      font-weight: bold;
      flex-shrink: 0;
    }
    .sm-btn:hover { background: var(--btn-h); }
    .sm-btn.rm { color: #dc4b4b; }

    /* ── Preview ─────────────────────────────────────────── */
    #preview-wrap {
      flex: 1;
      overflow: auto;
      background: var(--bg);
      position: relative;
    }
    #preview-wrap::-webkit-scrollbar { width: 8px; height: 8px; }
    #preview-wrap::-webkit-scrollbar-track { background: var(--sidebar); }
    #preview-wrap::-webkit-scrollbar-thumb { background: #3e3e4b; border-radius: 3px; }

    #empty-msg {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: var(--muted);
      font-size: 15px;
      text-align: center;
      pointer-events: none;
    }

    #collage-canvas {
      display: block;
    }

    /* Drop highlight */
    body.drag-over { outline: 3px dashed var(--accent); outline-offset: -3px; }

    /* ── Status bar ──────────────────────────────────────── */
    #status {
      background: #0b0b0d;
      border-top: 1px solid var(--card-bd);
      color: var(--muted);
      font-size: 11px;
      padding: 5px 10px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- ── Toolbar ──────────────────────────────────────────── -->
<div id="toolbar">
  <div class="group">
    <button class="btn-accent" onclick="openFilePicker()">＋ Add Images</button>
    <input type="file" id="file-input" multiple accept="image/*" style="display:none" onchange="onFileInput(this)">
  </div>

  <div class="sep"></div>

  <div class="group">
    <label>Row H:</label>
    <input type="range" id="row-h" min="80" max="700" value="260" style="width:110px" oninput="markDirty()">
  </div>

  <div class="sep"></div>

  <div class="group">
    <label>Gap:</label>
    <input type="range" id="gap" min="0" max="60" value="8" style="width:80px" oninput="markDirty()">
  </div>

  <div class="sep"></div>

  <div class="group">
    <label>BG:</label>
    <input type="color" id="bg-color" value="#ffffff" style="width:36px;height:28px;padding:2px;border:1px solid var(--card-bd);border-radius:5px;background:var(--btn);cursor:pointer" oninput="markDirty()">
    <label class="check-label">
      <input type="checkbox" id="fill-last" checked onchange="markDirty()"> Fill last row
    </label>
  </div>

  <div class="sep"></div>

  <div class="group" style="margin-left:auto">
    <span id="count">0 images</span>
    <div class="sep"></div>
    <label>Export W:</label>
    <input type="number" id="export-w" value="3840" min="400" max="12000" step="200">
    <button class="btn-green" onclick="exportPNG()">Export PNG</button>
    <button class="btn-red" onclick="clearAll()">Clear All</button>
  </div>
</div>

<!-- ── Main ─────────────────────────────────────────────── -->
<div id="main">

  <div id="sidebar" id="drop-zone"></div>

  <div id="preview-wrap">
    <div id="empty-msg">No images yet — add some or drag &amp; drop here</div>
    <canvas id="collage-canvas"></canvas>
  </div>

</div>

<!-- ── Status ───────────────────────────────────────────── -->
<div id="status">
  Drag &amp; drop images anywhere &nbsp;•&nbsp; Use ▲▼ to reorder &nbsp;•&nbsp;
  Collage updates live &nbsp;•&nbsp; Export exports at full resolution
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const images = []; // { img: HTMLImageElement, name, w, h, url }

// ── File loading ───────────────────────────────────────────────────────────
function openFilePicker() {
  document.getElementById('file-input').click();
}

function onFileInput(input) {
  const files = Array.from(input.files);
  input.value = '';
  loadFiles(files);
}

function loadFiles(files) {
  const imageFiles = files.filter(f => f.type.startsWith('image/'));
  const promises = imageFiles.map(f => loadOneFile(f));
  Promise.allSettled(promises).then(() => {
    rebuildSidebar();
    markDirty();
  });
}

function loadOneFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const dataUrl = e.target.result;
      const img = new Image();
      img.onload = () => {
        images.push({ img, name: file.name, w: img.naturalWidth, h: img.naturalHeight, url: dataUrl });
        resolve();
      };
      img.onerror = reject;
      img.src = dataUrl;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function rebuildSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  images.forEach((entry, i) => {
    const card = document.createElement('div');
    card.className = 'thumb-card';

    const thumb = document.createElement('img');
    thumb.className = 'thumb';
    thumb.src = entry.url;
    thumb.alt = entry.name;
    card.appendChild(thumb);

    const info = document.createElement('div');
    info.className = 'thumb-info';
    info.innerHTML = `<div class="tname" title="${entry.name}">${clip(entry.name, 26)}</div>
                      <div class="tdims">${entry.w} × ${entry.h}</div>`;
    card.appendChild(info);

    const btns = document.createElement('div');
    btns.className = 'thumb-btns';
    btns.innerHTML = `
      <button class="sm-btn" onclick="moveImage(${i},${i-1})">▲</button>
      <button class="sm-btn" onclick="moveImage(${i},${i+1})">▼</button>
      <button class="sm-btn rm" onclick="removeImage(${i})">✕</button>`;
    card.appendChild(btns);

    sb.appendChild(card);
  });

  document.getElementById('count').textContent =
    images.length + (images.length === 1 ? ' image' : ' images');
  document.getElementById('empty-msg').style.display = images.length ? 'none' : '';
  document.getElementById('collage-canvas').style.display = images.length ? '' : 'none';
}

function removeImage(i) {
  images.splice(i, 1);
  rebuildSidebar();
  markDirty();
}

function moveImage(from, to) {
  if (to < 0 || to >= images.length) return;
  const [e] = images.splice(from, 1);
  images.splice(to, 0, e);
  rebuildSidebar();
  markDirty();
}

function clearAll() {
  if (!images.length) return;
  if (!confirm('Clear all images?')) return;
  images.length = 0;
  rebuildSidebar();
  markDirty();
}

// ── Collage layout ─────────────────────────────────────────────────────────
function naturalW(i, rowH) {
  return images[i].w * rowH / images[i].h;
}

function sumNaturalW(row, rowH) {
  return row.reduce((s, i) => s + naturalW(i, rowH), 0);
}

function packRows(canvasW, tRowH, gap) {
  const rows = [];
  let cur = [], curW = 0;
  for (let i = 0; i < images.length; i++) {
    const nw   = naturalW(i, tRowH);
    const need = cur.length === 0 ? nw : nw + gap;
    if (cur.length > 0 && curW + need > canvasW) {
      rows.push(cur); cur = []; curW = 0;
    }
    cur.push(i);
    curW += cur.length === 1 ? nw : nw + gap;
  }
  if (cur.length) rows.push(cur);
  return rows;
}

function rowHeight(row, canvasW, tRowH, gap, natural) {
  if (natural) return tRowH;
  const sumNW = sumNaturalW(row, tRowH);
  const avail = canvasW - gap * (row.length - 1);
  return Math.round(tRowH * avail / sumNW);
}

// packW: width used for row groupings (use preview width so export matches preview layout)
function renderToCanvas(canvas, canvasW, packW) {
  packW = packW || canvasW;
  const tRowH   = parseInt(document.getElementById('row-h').value);
  const gap     = parseInt(document.getElementById('gap').value);
  const fillLast= document.getElementById('fill-last').checked;
  const bgColor = document.getElementById('bg-color').value;

  const rows = packRows(packW, tRowH, gap);
  const renderGap = packW === canvasW ? gap : Math.round(gap * canvasW / packW);
  if (!rows.length) return;

  // Compute total height
  let totalH = 0;
  rows.forEach((row, r) => {
    const natural = (r === rows.length - 1) && !fillLast;
    totalH += Math.max(1, rowHeight(row, canvasW, tRowH, renderGap, natural));
    if (r < rows.length - 1) totalH += renderGap;
  });

  canvas.width  = canvasW;
  canvas.height = Math.max(1, totalH);

  const ctx = canvas.getContext('2d');
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, canvasW, totalH);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  let y = 0;
  rows.forEach((row, r) => {
    const natural = (r === rows.length - 1) && !fillLast;
    const rowH    = Math.max(1, rowHeight(row, canvasW, tRowH, renderGap, natural));
    const sumNW   = sumNaturalW(row, tRowH);
    const avail   = canvasW - renderGap * (row.length - 1);
    const scale   = natural ? 1.0 : avail / sumNW;

    let x = 0;
    row.forEach((idx, j) => {
      let imgW;
      if (natural) {
        imgW = Math.round(naturalW(idx, tRowH));
      } else if (j === row.length - 1) {
        imgW = canvasW - x; // absorb rounding error
      } else {
        imgW = Math.round(naturalW(idx, tRowH) * scale);
      }
      imgW = Math.max(1, imgW);
      ctx.drawImage(images[idx].img, x, y, imgW, rowH);
      x += imgW + renderGap;
    });

    y += rowH + (r < rows.length - 1 ? renderGap : 0);
  });
}

// ── Preview rendering ──────────────────────────────────────────────────────
let dirty = false;
let rafPending = false;
let lastPreviewW = 0;

function markDirty() {
  dirty = true;
  if (!rafPending) {
    rafPending = true;
    requestAnimationFrame(repaint);
  }
}

function repaint() {
  rafPending = false;
  if (!images.length || !dirty) return;
  dirty = false;

  const wrap = document.getElementById('preview-wrap');
  const canvas = document.getElementById('collage-canvas');
  lastPreviewW = Math.max(wrap.clientWidth, 400);
  renderToCanvas(canvas, lastPreviewW);
}

// ── Export ─────────────────────────────────────────────────────────────────
function exportPNG() {
  if (!images.length) { alert('No images to export.'); return; }
  const exportW  = parseInt(document.getElementById('export-w').value) || 3840;
  const packW    = lastPreviewW > 0 ? lastPreviewW : exportW;
  const offscreen = document.createElement('canvas');
  renderToCanvas(offscreen, exportW, packW);
  offscreen.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'collage.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
}

// ── Drag & drop ────────────────────────────────────────────────────────────
document.addEventListener('dragover', e => {
  e.preventDefault();
  document.body.classList.add('drag-over');
});
document.addEventListener('dragleave', e => {
  if (!e.relatedTarget) document.body.classList.remove('drag-over');
});
document.addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files);
  loadFiles(files);
});

// ── Resize observer ────────────────────────────────────────────────────────
const resizeObs = new ResizeObserver(() => markDirty());
resizeObs.observe(document.getElementById('preview-wrap'));

// ── Helpers ────────────────────────────────────────────────────────────────
function clip(s, max) {
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}

// Init
rebuildSidebar();
</script>
</body>
</html>
