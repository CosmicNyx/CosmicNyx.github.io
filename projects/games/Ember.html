<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1" name="viewport">
<title>Ember of Self</title>
<style>
/* ===== BASE RESET & BODY ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow-x: hidden; }

body {
    font: 1.5em/1.5 Georgia, serif;
    background-color: #0a0e1a;
    color: #cde;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    transition: background-color 4s ease, color 2s ease;
}

/* ===== LAYOUT: fixed text area + fixed choices area ===== */
#passage-container {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

#text-area {
    width: 100%;
    max-width: 650px;
    text-align: center;
    padding: 0 8%;
    flex: 0 0 auto;
    pointer-events: auto;
    min-height: 3em;
}

#choices-area {
    position: fixed;
    bottom: 180px;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 500px;
    text-align: center;
    pointer-events: auto;
    min-height: 2em;
}

/* ===== TEXT ANIMATIONS (Equivocal-style dissolve) ===== */
@keyframes dissolve-in {
    0% { opacity: 0; transform: translateY(0.2em); }
    100% { opacity: 1; transform: translateY(0); }
}
@keyframes fade-in-out {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
}
@keyframes pulse-glow {
    0%, 100% { text-shadow: 0 0 8px rgba(255,160,50,0.4); }
    50% { text-shadow: 0 0 20px rgba(255,160,50,0.9), 0 0 40px rgba(255,100,20,0.5); }
}
@keyframes ember-float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
}
@keyframes flicker {
    0%, 29%, 31%, 63%, 65%, 77%, 79%, 86%, 88%, 91%, 93% { opacity: 0; }
    30% { opacity: .2; }
    64% { opacity: .4; }
    78% { opacity: .6; }
    87% { opacity: .8; }
    92%, 100% { opacity: 1; }
}
@keyframes heat-shimmer {
    0% { filter: blur(0px); }
    25% { filter: blur(1px); }
    50% { filter: blur(2px); }
    75% { filter: blur(1px); }
    100% { filter: blur(0px); }
}

.dissolve {
    animation: dissolve-in 0.8s ease forwards;
    opacity: 0;
}
@keyframes dissolve-out {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-0.2em); }
}
.dissolve-out {
    animation: dissolve-out 0.35s ease forwards;
}
.flicker-in {
    animation: flicker 0.8s forwards;
}

/* ===== LINKS / CHOICES ===== */
.choice-link {
    cursor: pointer;
    color: #4a8fbf;
    font-weight: bold;
    text-decoration: none;
    transition: color 0.3s ease, text-shadow 0.3s ease;
    display: block;
    margin: 0.6em 0;
    font-size: 0.95em;
}
.choice-link:hover {
    color: #7ec8e3;
    text-shadow: 0 0 12px rgba(126, 200, 227, 0.5);
}
.choice-link:active {
    color: #dd4b39;
}

/* ===== SURVEY LINK - warm amber, fits the brazier-light ending ===== */
.survey-link {
    display: inline-block;
    margin-top: 0.4em;
    color: #d4a84b;
    font-size: 0.75em;
    font-style: italic;
    letter-spacing: 0.04em;
    text-decoration: none;
    border-bottom: 1px solid rgba(212, 168, 75, 0.35);
    transition: color 0.3s, border-color 0.3s, text-shadow 0.3s;
    cursor: pointer;
}
.survey-link:hover {
    color: #ffd06e;
    border-color: rgba(255, 208, 110, 0.7);
    text-shadow: 0 0 14px rgba(255, 200, 80, 0.45);
}

/* ===== EMBER / FLAME CANVAS ===== */
#ember-container {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 100;
    pointer-events: none;
}
#flame-canvas {
    display: block;
}
#ember-label {
    font-size: 0.5em;
    color: #887;
    margin-top: -10px;
    transition: color 1s;
}

/* ===== FLAME BAR ===== */
#flame-bar-container {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 8px;
    height: 120px;
    background: rgba(255,255,255,0.05);
    border-radius: 4px;
    overflow: hidden;
    z-index: 100;
    border: 1px solid rgba(255,255,255,0.08);
}
#flame-bar {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 0%;
    background: linear-gradient(to top, #ff8800, #ff4400, #ff0000);
    border-radius: 4px;
    transition: height 0.5s ease;
}
#flame-bar.danger {
    background: linear-gradient(to top, #ffcc00, #ff4400, #ff0000);
    box-shadow: 0 0 10px rgba(255,68,0,0.5);
}

/* ===== JOURNAL / STATS ===== */
#journal-container {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 100;
    pointer-events: none;
}
.journal-pip {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #aac;
    margin: 4px 0;
    transition: background 0.4s, opacity 0.5s, box-shadow 0.4s;
    box-shadow: 0 0 4px rgba(170,170,204,0.3);
}
.journal-pip.flash {
    background: #ffe033;
    box-shadow: 0 0 8px rgba(255,220,0,0.95), 0 0 18px rgba(255,180,0,0.5);
    transition: background 0.2s, box-shadow 0.2s;
}
.journal-pip.lost {
    background: #1e1e1e;
    opacity: 0.2;
    box-shadow: none;
    transition: background 0.5s, opacity 0.6s, box-shadow 0s;
}

/* ===== HEAT SHIMMER OVERLAY ===== */
#heat-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    background: radial-gradient(ellipse at center, rgba(255,100,0,0.15), transparent 70%);
    animation: heat-shimmer 0.8s ease-in-out infinite;
    transition: opacity 2s;
}
#heat-overlay.active {
    opacity: 1;
}

/* ===== BREATHING PROMPT ===== */
.breathing-prompt {
    font-size: 0.7em;
    color: #667;
    animation: fade-in-out 3s ease-in-out infinite;
}

/* ===== ICE TO GOLD THEME TRANSITIONS ===== */
body.ice-theme {
    background-color: #0a0e1a;
    color: #b0c8d8;
}
body.threshold-theme {
    background: linear-gradient(to bottom, #0a0e1a, #1a1520);
    color: #c0c0d0;
}
body.forest-theme {
    background: linear-gradient(to bottom, #0c1015, #101820);
    color: #99aabb;
}
body.gold-shift-theme {
    background: linear-gradient(to bottom, #1a1510, #201a0a);
    color: #d4c49a;
}
body.thaw-theme {
    background: linear-gradient(to bottom, #201a0a, #2a2010);
    color: #ffd700;
}
body.ember-end-theme {
    background: linear-gradient(to bottom, #120e08, #1a1208);
    color: #c8a96e;
}

/* ===== SCREEN FADE ===== */
#screen-fade {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #000;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
}
#screen-fade.active {
    opacity: 1;
    pointer-events: all;
}

/* ===== IDLE PULSE REMINDER ===== */
@keyframes ember-pulse-reminder {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.15); }
}
#ember-container.pulsing {
    animation: ember-pulse-reminder 1.5s ease-in-out infinite;
}
</style>
</head>
<body class="ice-theme">

<!-- Screen Fade Overlay -->
<div id="screen-fade"></div>

<!-- Heat Shimmer Overlay -->
<div id="heat-overlay"></div>

<!-- Ember / Flame Indicator -->
<div id="ember-container">
    <canvas id="flame-canvas" width="120" height="160"></canvas>
    <div id="ember-label"></div>
</div>

<!-- Flame Intensity Bar -->
<div id="flame-bar-container" style="display:none;">
    <div id="flame-bar"></div>
</div>

<!-- Journal Pips (Identity Stats) -->
<div id="journal-container"></div>

<!-- Main Passage Area -->
<div id="passage-container">
    <div id="text-area"></div>
</div>
<!-- Choices always fixed at bottom -->
<div id="choices-area"></div>

<script>
// ==========================================================
//  EMBER OF TRUTH - Twine-style engine (Equivocal coding style)
// ==========================================================

// ===== GAME STATE =====
const state = {
    maxIdentityStats: 5,
    currentStats: 5,
    thermalThreshold: 0,
    worldThaw: 0,
    flameAlive: true,
    flameIntensity: 50,
    maxFlameIntensity: 100,
    hasBreathed: false,
    hasSacrificed: false,
    optionsShownTime: null,
    rushCount: 0,
    currentPassage: null,
    timers: [],
    idleTimer: null,
    thermalTimer: null,
    fragmentsUnlocked: [],
    playerMoved: false,
    lastPassageBeforeDeath: null,
    hasSeenFlameHelp: false,
};

// ===== DOM REFS =====
const passageEl = document.getElementById('passage-container');
const textArea = document.getElementById('text-area');
const choicesArea = document.getElementById('choices-area');
const flameCanvas = document.getElementById('flame-canvas');
const flameCtx = flameCanvas.getContext('2d');
const emberLabel = document.getElementById('ember-label');
const emberContainer = document.getElementById('ember-container');
const flameBarContainer = document.getElementById('flame-bar-container');
const flameBar = document.getElementById('flame-bar');
const heatOverlay = document.getElementById('heat-overlay');
const screenFade = document.getElementById('screen-fade');
const journalContainer = document.getElementById('journal-container');

// ==========================================================
//  PARTICLE FLAME SYSTEM
// ==========================================================
const FLAME_W = 120, FLAME_H = 160;
const FLAME_CX = FLAME_W / 2, FLAME_BASE_Y = FLAME_H - 20;
let particles = [];
let sparks = [];
let flameAnimId = null;

class FlameParticle {
    constructor(intensity, maxIntensity) {
        const ratio = Math.max(0.05, intensity / maxIntensity);
        const spread = 6 + ratio * 14;
        this.x = FLAME_CX + (Math.random() - 0.5) * spread;
        this.y = FLAME_BASE_Y;
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = -(0.8 + Math.random() * 1.5) * (0.5 + ratio * 0.8);
        this.life = 1.0;
        this.decay = 0.015 + Math.random() * 0.025;
        this.size = (2 + Math.random() * 4) * (0.4 + ratio * 0.8);
        this.edgeFactor = Math.abs(this.x - FLAME_CX) / Math.max(1, spread * 0.5);
    }
    update() {
        this.x += this.vx + (Math.random() - 0.5) * 0.3;
        this.y += this.vy;
        this.vy *= 0.99;
        this.vx *= 0.98;
        this.life -= this.decay;
        this.size *= 0.995;
    }
    draw(ctx) {
        if (this.life <= 0) return;
        const alpha = this.life * 0.85;
        const t = this.life;
        const e = Math.min(1, this.edgeFactor);
        const effective = Math.max(0, t - e * 0.35);
        let r, g, b;
        if (effective > 0.75) {
            const f = (effective - 0.75) / 0.25;
            r = Math.floor(180 + f * 75);
            g = Math.floor(200 + f * 55);
            b = Math.floor(220 + f * 35);
        } else if (effective > 0.45) {
            const f = (effective - 0.45) / 0.3;
            r = 255;
            g = Math.floor(180 + f * 20);
            b = Math.floor(20 + f * 200);
        } else if (effective > 0.2) {
            const f = (effective - 0.2) / 0.25;
            r = 255;
            g = Math.floor(80 + f * 100);
            b = Math.floor(5 + f * 15);
        } else {
            const f = effective / 0.2;
            r = Math.floor(150 + f * 105);
            g = Math.floor(20 + f * 60);
            b = Math.floor(f * 5);
        }
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        ctx.fill();
    }
}

class Spark {
    constructor(intensity, maxIntensity) {
        const ratio = Math.max(0.05, intensity / maxIntensity);
        this.x = FLAME_CX + (Math.random() - 0.5) * (4 + ratio * 10);
        this.y = FLAME_BASE_Y - Math.random() * 10;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = -(1.5 + Math.random() * 3) * (0.4 + ratio * 0.6);
        this.life = 1.0;
        this.decay = 0.03 + Math.random() * 0.04;
        this.size = 0.8 + Math.random() * 1.5;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.02;
        this.life -= this.decay;
    }
    draw(ctx) {
        if (this.life <= 0) return;
        const alpha = this.life * 0.9;
        const r = 255;
        const g = Math.floor(120 + this.life * 135);
        const b = Math.floor(this.life * 180);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        ctx.fill();
    }
}

class AshParticle {
    constructor() {
        this.x = FLAME_CX + (Math.random() - 0.5) * 12;
        this.y = FLAME_BASE_Y;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = -(0.1 + Math.random() * 0.4);
        this.life = 1.0;
        this.decay = 0.008 + Math.random() * 0.01;
        this.size = 1 + Math.random() * 2;
    }
    update() {
        this.x += this.vx + (Math.random() - 0.5) * 0.2;
        this.y += this.vy;
        this.life -= this.decay;
        this.size *= 0.998;
    }
    draw(ctx) {
        if (this.life <= 0) return;
        const alpha = this.life * 0.3;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(120, 100, 80, ${alpha})`;
        ctx.fill();
    }
}

let ashParticles = [];

let mouseX = 0, mouseY = 0, prevMouseX = 0, prevMouseY = 0;
let mouseSpeed = 0;
let mouseSpeedRaw = 0;
const MOUSE_SMOOTH = 0.12;

let windStress = 0;
let stillStress = 0;
const WIND_BUILD_RATE   = 0.25;
const WIND_DECAY_RATE   = 0.12;
const STILL_BUILD_RATE  = 0.06;
const STILL_DECAY_RATE  = 0.15;
const STRESS_KILL_THRESHOLD = 100;

document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});
document.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
    }
});

function updateMouseSpeed() {
    const dx = mouseX - prevMouseX;
    const dy = mouseY - prevMouseY;
    mouseSpeedRaw = Math.sqrt(dx * dx + dy * dy);
    mouseSpeed = mouseSpeed + (mouseSpeedRaw - mouseSpeed) * MOUSE_SMOOTH;
    prevMouseX = mouseX;
    prevMouseY = mouseY;
}

function getMouseInfluence() {
    return Math.min(1, mouseSpeed / 40);
}

function updateStressMeters() {
    if (!state.flameAlive) return;

    const mi = getMouseInfluence();

    if (mi > 0.65) {
        const excess = (mi - 0.65) / 0.35;
        windStress = Math.min(STRESS_KILL_THRESHOLD, windStress + WIND_BUILD_RATE * excess);
    } else {
        windStress = Math.max(0, windStress - WIND_DECAY_RATE);
    }

    if (mi < 0.02) {
        stillStress = Math.min(STRESS_KILL_THRESHOLD, stillStress + STILL_BUILD_RATE);
        if (state.flameIntensity < state.maxFlameIntensity) {
            state.flameIntensity = Math.min(state.maxFlameIntensity, state.flameIntensity + 0.02);
        }
    } else {
        stillStress = Math.max(0, stillStress - STILL_DECAY_RATE * Math.max(0.1, mi));
    }

    if (windStress >= STRESS_KILL_THRESHOLD) {
        windStress = 0;
        stillStress = 0;
        state.lastPassageBeforeDeath = state.currentPassage;
        killFlame();
        goToPassage('wind_killed');
    } else if (stillStress >= STRESS_KILL_THRESHOLD) {
        windStress = 0;
        stillStress = 0;
        state.lastPassageBeforeDeath = state.currentPassage;
        killFlame();
        goToPassage('overheat_killed');
    }
}

function flameLoop() {
    updateMouseSpeed();
    updateStressMeters();
    flameCtx.clearRect(0, 0, FLAME_W, FLAME_H);

    if (state.flameAlive) {
        const intensity = state.flameIntensity;
        const maxI = state.maxFlameIntensity;
        const ratio = Math.max(0.05, intensity / maxI);
        const mi = getMouseInfluence();
        const calm = 1 - mi;
        const maxStress = Math.max(windStress, stillStress);
        const stressFade = 1 - (maxStress / STRESS_KILL_THRESHOLD) * 0.7;
        const visFactor = calm * calm;
        const effRatio = ratio * (0.08 + visFactor * 0.92) * stressFade;
        const stressJitter = maxStress > 60 ? (maxStress - 60) / 40 : 0;
        const flickerJitterX = (mi * mi + stressJitter * 0.5) * (Math.random() - 0.5) * 16;
        const flickerJitterY = (mi * mi + stressJitter * 0.3) * (Math.random() - 0.5) * 6;
        const spawnCount = Math.max(0, Math.floor((1 + effRatio * 6) * (0.1 + calm * 0.9) * stressFade));
        for (let i = 0; i < spawnCount; i++) {
            const p = new FlameParticle(intensity, maxI);
            p.x += flickerJitterX + (Math.random() - 0.5) * mi * 18;
            p.y += flickerJitterY;
            p.vx += (Math.random() - 0.5) * mi * 3;
            p.vy *= (0.3 + calm * 1.0);
            p.size *= (0.3 + calm * 1.0);
            p.decay += mi * 0.04;
            if (mi > 0.3) p.life = Math.max(0.15, 1.0 - mi * 0.6);
            particles.push(p);
        }
        if (calm > 0.6 && Math.random() < 0.1 + effRatio * 0.15) {
            const s = new Spark(intensity, maxI);
            s.vx *= 0.4;
            sparks.push(s);
        }
        if (mi > 0.5 && Math.random() < mi * 0.3) {
            const s = new Spark(intensity, maxI);
            s.vx = (Math.random() - 0.5) * 5;
            s.vy *= 0.4;
            s.decay += 0.03;
            sparks.push(s);
        }
        const glowRadius = (10 + effRatio * 30) * (0.3 + calm * 0.7);
        const glowAlpha = (0.05 + effRatio * 0.25) * (0.1 + calm * 0.9);
        const glowCX = FLAME_CX + flickerJitterX * 0.3;
        const glow = flameCtx.createRadialGradient(glowCX, FLAME_BASE_Y, 0, glowCX, FLAME_BASE_Y, Math.max(1, glowRadius));
        glow.addColorStop(0, `rgba(200, 220, 255, ${Math.max(0, glowAlpha * 0.9)})`);
        glow.addColorStop(0.25, `rgba(255, 240, 180, ${Math.max(0, glowAlpha * 0.6)})`);
        glow.addColorStop(0.6, `rgba(255, 120, 20, ${Math.max(0, glowAlpha * 0.3)})`);
        glow.addColorStop(1, 'rgba(150, 30, 0, 0)');
        flameCtx.fillStyle = glow;
        flameCtx.fillRect(0, 0, FLAME_W, FLAME_H);
        const coreSize = Math.max(0.5, (3 + effRatio * 6) * (0.15 + calm * 0.85));
        const coreCX = FLAME_CX + flickerJitterX * 0.15;
        const coreCY = FLAME_BASE_Y + flickerJitterY * 0.15;
        const coreGlow = flameCtx.createRadialGradient(coreCX, coreCY, 0, coreCX, coreCY, coreSize);
        if (calm > 0.7) {
            coreGlow.addColorStop(0, `rgba(210, 230, 255, ${0.9 * calm})`);
            coreGlow.addColorStop(0.3, `rgba(255, 250, 200, ${0.7 * calm})`);
            coreGlow.addColorStop(0.7, `rgba(255, 150, 40, ${0.4 * calm})`);
            coreGlow.addColorStop(1, 'rgba(200, 60, 0, 0)');
        } else if (calm > 0.3) {
            coreGlow.addColorStop(0, `rgba(255, 220, 120, ${0.5 * calm})`);
            coreGlow.addColorStop(0.5, `rgba(255, 120, 30, ${0.3 * calm})`);
            coreGlow.addColorStop(1, 'rgba(180, 40, 0, 0)');
        } else {
            coreGlow.addColorStop(0, `rgba(180, 60, 15, ${0.2 + calm * 0.3})`);
            coreGlow.addColorStop(1, 'rgba(100, 20, 0, 0)');
        }
        flameCtx.beginPath();
        flameCtx.arc(coreCX, coreCY, coreSize, 0, Math.PI * 2);
        flameCtx.fillStyle = coreGlow;
        flameCtx.fill();
        if ((mi > 0.7 && Math.random() < mi * 0.25) || (maxStress > 70 && Math.random() < 0.2)) {
            ashParticles.push(new AshParticle());
        }
        if (stillStress > 65) {
            heatOverlay.classList.add('active');
        } else if (windStress < 50 && stillStress < 50) {
            heatOverlay.classList.remove('active');
        }
        if (maxStress < 20 && calm > 0.5) ashParticles = [];
    } else {
        if (Math.random() < 0.15) {
            ashParticles.push(new AshParticle());
        }
        const deadGlow = flameCtx.createRadialGradient(FLAME_CX, FLAME_BASE_Y, 0, FLAME_CX, FLAME_BASE_Y, 6);
        deadGlow.addColorStop(0, 'rgba(80, 60, 40, 0.4)');
        deadGlow.addColorStop(1, 'rgba(40, 30, 20, 0)');
        flameCtx.beginPath();
        flameCtx.arc(FLAME_CX, FLAME_BASE_Y, 6, 0, Math.PI * 2);
        flameCtx.fillStyle = deadGlow;
        flameCtx.fill();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(flameCtx);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
        sparks[i].update();
        sparks[i].draw(flameCtx);
        if (sparks[i].life <= 0) sparks.splice(i, 1);
    }
    for (let i = ashParticles.length - 1; i >= 0; i--) {
        ashParticles[i].update();
        ashParticles[i].draw(flameCtx);
        if (ashParticles[i].life <= 0) ashParticles.splice(i, 1);
    }

    flameAnimId = requestAnimationFrame(flameLoop);
}

function startFlameAnimation() {
    if (!flameAnimId) flameLoop();
}
function stopFlameAnimation() {
    if (flameAnimId) { cancelAnimationFrame(flameAnimId); flameAnimId = null; }
}

startFlameAnimation();

// ===== UTILITY FUNCTIONS =====
function clearAllTimers() {
    state.timers.forEach(t => clearTimeout(t));
    state.timers = [];
    if (state.idleTimer) { clearInterval(state.idleTimer); state.idleTimer = null; }
    if (state.thermalTimer) { clearInterval(state.thermalTimer); state.thermalTimer = null; }
}

function delay(ms) {
    return new Promise(resolve => {
        const t = setTimeout(resolve, ms);
        state.timers.push(t);
    });
}

function readingDelay(html) {
    const plain = html.replace(/<[^>]*>/g, '').trim();
    const words = plain.split(/\s+/).filter(w => w.length > 0).length;
    return Math.max(1400, Math.min(5500, 1000 + words * 160));
}

async function showText(text, _container) {
    const existing = textArea.querySelector('.active-text');
    if (existing) {
        existing.classList.remove('dissolve');
        existing.classList.add('dissolve-out');
        await delay(350);
        existing.remove();
    }
    const span = document.createElement('span');
    span.className = 'dissolve active-text';
    span.innerHTML = text.replace(/^(<br\s*\/?>)+/g, '');
    textArea.appendChild(span);
    await delay(readingDelay(text));
    return span;
}

function dissolveText(text, _container) {
    const existing = textArea.querySelector('.active-text');
    if (existing) existing.remove();
    const span = document.createElement('span');
    span.className = 'dissolve active-text';
    span.innerHTML = text.replace(/^(<br\s*\/?>)+/g, '');
    textArea.appendChild(span);
    return span;
}

async function showFlameHelp(deathType) {
    state.hasSeenFlameHelp = true;
    const dim = 'color:rgba(180,205,225,0.48);';
    await showText(`<span style="${dim}">The flame follows your hand.</span>`, passageEl);
    if (deathType === 'wind') {
        await showText(`<span style="${dim}">Moving too fast blows it out.</span>`, passageEl);
    } else {
        await showText(`<span style="${dim}">Staying perfectly still smothers it.</span>`, passageEl);
    }
    await showText(`<span style="${dim}">A slow, gentle drift across the screen keeps it alive.</span>`, passageEl);

    await new Promise(resolve => {
        const link = document.createElement('span');
        link.className = 'choice-link dissolve';
        link.textContent = 'Open Your Palm';
        link.addEventListener('click', () => {
            link.remove();
            resolve();
        });
        choicesArea.appendChild(link);
    });

    choicesArea.innerHTML = '';
}

function addLineBreak(_container) {}

function addChoiceLink(text, targetPassage, _container, opts = {}) {
    const link = document.createElement('span');
    link.className = 'choice-link dissolve';
    link.textContent = text;
    link.addEventListener('click', () => {
        const now = Date.now();
        const responseTime = state.optionsShownTime ? (now - state.optionsShownTime) / 1000 : 999;

        if (opts.canRush && responseTime < 1.5) {
            state.rushCount++;
            goToPassage('rushed');
            return;
        }

        if (opts.onSelect) opts.onSelect(responseTime);

        goToPassage(targetPassage);
    });
    choicesArea.appendChild(link);
}

// ===== EMBER VISUALS =====
function updateEmberVisual() {}

function killFlame() {
    state.flameAlive = false;
    state.flameIntensity = 0;
    particles = [];
    sparks = [];
}

function reviveFlame(intensity) {
    state.flameAlive = true;
    state.flameIntensity = intensity || 40;
    ashParticles = [];
}

// ===== FLAME BAR =====
function updateFlameBar() {
    flameBar.style.height = state.thermalThreshold + '%';
    if (state.thermalThreshold > 75) {
        flameBar.className = 'danger';
    } else {
        flameBar.className = '';
    }
}

// ===== JOURNAL PIPS =====
function renderJournal() {
    journalContainer.innerHTML = '';
    for (let i = 0; i < state.maxIdentityStats; i++) {
        const pip = document.createElement('div');
        pip.className = 'journal-pip' + (i >= state.currentStats ? ' lost' : '');
        journalContainer.appendChild(pip);
    }
}

async function flashPipsOnDeath() {
    const pips = [...journalContainer.querySelectorAll('.journal-pip:not(.lost)')];
    if (pips.length === 0) return;
    pips.forEach(p => p.classList.add('flash'));
    await delay(750);
    pips.forEach(p => p.classList.remove('flash'));
    await delay(300);
}

async function animatePipLoss() {
    const pips = [...journalContainer.querySelectorAll('.journal-pip')];
    const dyingPip = pips[state.currentStats];
    if (!dyingPip || dyingPip.classList.contains('lost')) {
        renderJournal();
        return;
    }
    dyingPip.classList.add('flash');
    await delay(450);
    dyingPip.classList.remove('flash');
    await delay(80);
    dyingPip.classList.add('lost');
    await delay(350);
}

// ===== THERMAL SYSTEM =====
function startThermalTimer() {
    flameBarContainer.style.display = 'block';
    state.thermalThreshold = 0;
    updateFlameBar();

    state.thermalTimer = setInterval(() => {
        if (!state.flameAlive) return;
        state.thermalThreshold += 2;
        state.flameIntensity = Math.min(state.maxFlameIntensity, state.flameIntensity + 1);
        updateEmberVisual();
        updateFlameBar();

        if (state.thermalThreshold >= 60) {
            heatOverlay.classList.add('active');
        }

        if (state.thermalThreshold >= 100) {
            clearInterval(state.thermalTimer);
            state.thermalTimer = null;
            heatOverlay.classList.remove('active');
            goToPassage('lingered_too_long');
        }
    }, 500);
}

function stopThermalTimer() {
    if (state.thermalTimer) {
        clearInterval(state.thermalTimer);
        state.thermalTimer = null;
    }
    heatOverlay.classList.remove('active');
    flameBarContainer.style.display = 'none';
}

// ===== IDLE REMINDER =====
function startIdleReminder() {
    if (state.idleTimer) clearTimeout(state.idleTimer);
    emberContainer.classList.remove('pulsing');
    state.idleTimer = setTimeout(() => {
        emberContainer.classList.add('pulsing');
    }, 10000);
}

function stopIdleReminder() {
    if (state.idleTimer) clearTimeout(state.idleTimer);
    emberContainer.classList.remove('pulsing');
}

// ===== BODY THEME =====
function setTheme(theme) {
    document.body.className = theme;
}

// ===== SCREEN FADE =====
function fadeToBlack() {
    return new Promise(resolve => {
        screenFade.classList.add('active');
        const t = setTimeout(resolve, 800);
        state.timers.push(t);
    });
}
function fadeFromBlack() {
    return new Promise(resolve => {
        screenFade.classList.remove('active');
        const t = setTimeout(resolve, 800);
        state.timers.push(t);
    });
}

    addChoiceLink('Sit and meditate', 'meditation', passageEl);
};

passages['meditation'] = async function() {
    state.fragmentsUnlocked.push('Fragment of Self: The Circle');

    await showText('You sit beside the brazier.', passageEl);
    await showText('<br><br>The ember rests.', passageEl);
    await showText('<br><br>For the first time, the silence is not empty.', passageEl);
    await showText('<br><br>It is warm.', passageEl);

    if (state.hasSacrificed) {
        await showText('<br><br><span style="color:#887766; font-size:0.75em;">The light is dimmer than it should be. You remember what you gave up.</span>', passageEl);
    }

    await showText('<br><br><em style="color:#daa520;">Fragment of Self unlocked.</em>', passageEl);

    addLineBreak(passageEl);

    const statsLost = state.maxIdentityStats - state.currentStats;
    if (statsLost > 0) {
        await showText('<br><span style="color:#776655; font-size:0.65em;">Fragments sacrificed: ' + statsLost + '</span>', passageEl);
    }

    await showText('<br><span style="color:#776655; font-size:0.65em;">Maximum flame intensity: ' + state.maxFlameIntensity + '%</span>', passageEl);

    await fadeToBlack();
    await delay(1000);
    textArea.innerHTML = '';
    choicesArea.innerHTML = '';
    await fadeFromBlack();

    goToPassage('survey_outro');
};

// ---------- SURVEY OUTRO ----------
passages['survey_outro'] = async function() {
    setTheme('ember-end-theme');

    // Hide game UI elements - this is a liminal rest space
    journalContainer.style.display = 'none';
    flameBarContainer.style.display = 'none';

    // Let the flame burn low and quiet
    state.flameIntensity = Math.min(state.flameIntensity, 35);

    await delay(800);

    await showText(
        '<div style="font-size:0.9em; color:#c8a050; letter-spacing:0.06em;">End of Vertical Slice</div>',
        passageEl
    );

    await showText(
        '<span style="font-size:0.65em; color:#8a7050; font-style:italic; letter-spacing:0.03em;">The fire remembers what the mind forgets.</span>',
        passageEl
    );

    await showText(
        '<span style="font-size:0.8em; color:#b09060;">Thank you for carrying the ember this far.</span>',
        passageEl
    );

    await showText(
        '<span style="font-size:0.72em; color:#7a6848;">Your journey leaves traces — impressions, questions, small warmths and frictions. If you are willing, I would hear them.</span>',
        passageEl
    );

    // Final lingering screen — survey link + restart, both fade in together
    const existing = textArea.querySelector('.active-text');
    if (existing) {
        existing.classList.remove('dissolve');
        existing.classList.add('dissolve-out');
        await delay(350);
        existing.remove();
    }

    const wrapper = document.createElement('div');
    wrapper.className = 'dissolve active-text';
    wrapper.style.cssText = 'display:flex; flex-direction:column; align-items:center; gap:1.4em;';

    const prompt = document.createElement('div');
    prompt.style.cssText = 'font-size:0.68em; color:#9a8460; font-style:italic; letter-spacing:0.04em; line-height:1.6;';
    prompt.innerHTML = 'Leave your tale in the embers.';

    const surveyBtn = document.createElement('a');
    surveyBtn.href = 'https://forms.gle/d5yhjR1wPwA7MVoL6';
    surveyBtn.target = '_blank';
    surveyBtn.rel = 'noopener noreferrer';
    surveyBtn.className = 'survey-link';
    surveyBtn.textContent = 'Open the Scroll of Testimony';

    const divider = document.createElement('div');
    divider.style.cssText = 'width:32px; height:1px; background:rgba(160,130,80,0.2); margin:0.2em auto;';

    const restart = document.createElement('span');
    restart.className = 'choice-link';
    restart.style.cssText = 'font-size:0.72em; color:#5a6870; font-weight:normal; margin-top:0.2em;';
    restart.textContent = 'Begin again';
    restart.addEventListener('click', () => goToPassage('title'));

    wrapper.appendChild(prompt);
    wrapper.appendChild(surveyBtn);
    wrapper.appendChild(divider);
    wrapper.appendChild(restart);
    textArea.appendChild(wrapper);
};

// ==========================================================
//  PASSAGE NAVIGATION
// ==========================================================
function goToPassage(name) {
    clearAllTimers();
    stopIdleReminder();
    state.currentPassage = name;
    textArea.innerHTML = '';
    choicesArea.innerHTML = '';

    if (passages[name]) {
        passages[name]();
    } else {
        dissolveText('<em>Passage "' + name + '" not found.</em>', passageEl);
    }
}

// ==========================================================
//  START
// ==========================================================
goToPassage('title');
</script>
</body>
</html>
